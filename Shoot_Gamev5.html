<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多場景射擊遊戲</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#5D5CDE'
                    }
                }
            }
        }
    </script>
    <style>
        canvas {
            cursor: crosshair;
        }
        .game-container {
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        /* 不同場景的背景 */
        .scene-gamepad {
            background-image: url('https://raw.githubusercontent.com/HKIIT-CW/AY2526_ShootingGame/refs/heads/main/game_bg_GSD5.png');
        }
        .scene-speaker {
            background-image: url('https://raw.githubusercontent.com/HKIIT-CW/AY2526_ShootingGame/refs/heads/main/game_bg_AIST2.png');
        }
        .scene-book {
            background-image: url('https://raw.githubusercontent.com/HKIIT-CW/AY2526_ShootingGame/refs/heads/main/game_bg_SE2.png');
        }
        .scene-lock {
            background-image: url('https://raw.githubusercontent.com/HKIIT-CW/AY2526_ShootingGame/refs/heads/main/game_bg_CS4.png');
        }
        .scene-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .scene-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        /* 全屏優化 */
        body {
            overflow-x: hidden;
        }
        .game-interface-large {
            min-height: 100vh;
            padding: 0.5rem;
        }
    </style>
</head>
<body class="bg-white dark:bg-gray-900 min-h-screen flex flex-col items-center justify-center p-2">
    <!-- 場景選擇界面 -->
    <div id="sceneSelector" class="w-full max-w-6xl mx-auto">
        <div class="text-center mb-8">
            <h1 class="text-6xl font-bold text-gray-800 dark:text-white mb-4">🎯HKIIT 射擊遊戲</h1>
            <p class="text-xl text-gray-600 dark:text-gray-300">選擇您想要的射擊場景</p>
        </div>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6">
            <!-- 遊戲手柄場景 -->
            <div class="scene-card bg-white dark:bg-gray-800 rounded-lg p-6 shadow-lg cursor-pointer" onclick="selectScene('gamepad')">
                <div class="text-center">
                    <div class="text-6xl mb-4">🎮</div>
                    <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-2">遊戲軟件開發高級文憑</h3>
                    <p class="text-gray-600 dark:text-gray-300 text-sm">射擊遊戲手柄</p>
                </div>
            </div>
            
            <!-- 智能音箱場景 -->
            <div class="scene-card bg-white dark:bg-gray-800 rounded-lg p-6 shadow-lg cursor-pointer" onclick="selectScene('speaker')">
                <div class="text-center">
                    <div class="text-6xl mb-4">🔊</div>
                    <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-2">人工智能及智能科技高級文憑</h3>
                    <p class="text-gray-600 dark:text-gray-300 text-sm">射擊智能音箱</p>
                </div>
            </div>
            
            <!-- 編程書籍場景 -->
            <div class="scene-card bg-white dark:bg-gray-800 rounded-lg p-6 shadow-lg cursor-pointer" onclick="selectScene('book')">
                <div class="text-center">
                    <div class="text-6xl mb-4">📚</div>
                    <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-2">軟件工程高級文憑</h3>
                    <p class="text-gray-600 dark:text-gray-300 text-sm">射擊編程書籍</p>
                </div>
            </div>
            
            <!-- 鎖牌場景 -->
            <div class="scene-card bg-white dark:bg-gray-800 rounded-lg p-6 shadow-lg cursor-pointer" onclick="selectScene('lock')">
                <div class="text-center">
                    <div class="text-6xl mb-4">🔒</div>
                    <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-2">網絡安全高級文憑</h3>
                    <p class="text-gray-600 dark:text-gray-300 text-sm">射擊鎖牌</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 遊戲界面 -->
    <div id="gameInterface" class="game-interface-large w-full max-w-none mx-auto hidden">
        <!-- 遊戲標題 -->
        <div class="text-center mb-4">
            <div class="flex items-center justify-center gap-4 mb-2">
                <button id="backToSelect" class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors">
                    ← 返回選擇
                </button>
                <h1 id="gameTitle" class="text-4xl font-bold text-gray-800 dark:text-white">🎯 射擊遊戲</h1>
                <div class="w-20"></div> <!-- 佔位符保持對稱 -->
            </div>
            
            <p id="scoreInfo" class="text-md text-gray-500 dark:text-gray-400"></p>
        </div>

        <div class="flex gap-4 h-full">
            <!-- 左側排名榜 -->
            <div class="w-72 bg-white dark:bg-gray-800 rounded-lg p-4 shadow-lg">
                <h3 class="text-xl font-bold text-gray-800 dark:text-white mb-4 text-center">🏆 排行榜</h3>
                <div id="leaderboard" class="space-y-2">
                    <div class="text-center text-gray-500 dark:text-gray-400">暫無記錄</div>
                </div>
            </div>

            <!-- 中間遊戲區域 -->
            <div class="flex-1 flex flex-col">
                <!-- 遊戲資訊 -->
                <div class="flex justify-between items-center mb-3 bg-white dark:bg-gray-800 rounded-lg p-3 shadow-lg">
                    <div class="text-xl font-semibold text-gray-800 dark:text-white">
                        本局得分: <span id="gameScore" class="text-green-500">0</span>
                    </div>
                    <div class="text-xl font-semibold text-gray-800 dark:text-white">
                        時間: <span id="time" class="text-red-500">30</span>秒
                    </div>
                    <button id="startBtn" class="px-8 py-3 bg-primary text-white rounded-lg hover:bg-purple-600 transition-colors font-semibold text-lg">
                        開始遊戲
                    </button>
                </div>

                <!-- 遊戲畫布 -->
                <div id="gameContainer" class="game-container rounded-lg shadow-xl overflow-hidden flex-1">
                    <canvas id="gameCanvas" class="w-full h-full block"></canvas>
                </div>
            </div>
        </div>

        <!-- 名字輸入彈窗 -->
        <div id="nameInputModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
            <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-xl max-w-md w-full mx-4 text-center">
                <h2 class="text-3xl font-bold text-gray-800 dark:text-white mb-4">🎯 遊戲結束！</h2>
                <div class="text-5xl font-bold text-primary mb-2" id="finalScore">0</div>
                <p class="text-lg text-gray-600 dark:text-gray-300 mb-6">分數</p>
                
                <div class="mb-6">
                    <label class="block text-gray-700 dark:text-gray-300 text-sm font-bold mb-2">
                        請輸入您的名字：
                    </label>
                    <input type="text" id="playerNameInput" maxlength="15" 
                           class="w-full px-4 py-2 text-base border rounded-lg focus:outline-none focus:ring-2 focus:ring-primary dark:bg-gray-700 dark:border-gray-600 dark:text-white"
                           placeholder="輸入您的名字">
                </div>
                
                <div class="flex space-x-3">
                    <button id="playAgainBtn" class="flex-1 px-6 py-3 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors font-semibold">
                        再玩一次
                    </button>
                    <button id="saveScoreBtn" class="flex-1 px-6 py-3 bg-primary text-white rounded-lg hover:bg-purple-600 transition-colors font-semibold">
                        保存成績
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 暗黑模式支援
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', event => {
            if (event.matches) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        });

        // 遊戲變數
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameScoreElement = document.getElementById('gameScore');
        const timeElement = document.getElementById('time');
        const startBtn = document.getElementById('startBtn');
        const nameInputModal = document.getElementById('nameInputModal');
        const finalScoreElement = document.getElementById('finalScore');
        const playerNameInput = document.getElementById('playerNameInput');
        const playAgainBtn = document.getElementById('playAgainBtn');
        const saveScoreBtn = document.getElementById('saveScoreBtn');
        const leaderboardElement = document.getElementById('leaderboard');
        const sceneSelectorElement = document.getElementById('sceneSelector');
        const gameInterfaceElement = document.getElementById('gameInterface');
        const gameTitleElement = document.getElementById('gameTitle');
        const scoreInfoElement = document.getElementById('scoreInfo');
        const gameContainerElement = document.getElementById('gameContainer');
        const backToSelectBtn = document.getElementById('backToSelect');

        // 當前選擇的場景
        let currentScene = 'gamepad';

        // 場景配置
        const sceneConfigs = {
            gamepad: {
                title: '🎮 射擊遊戲手柄',
                scoreInfo: '大手柄🎮=5分 | 小手柄🎮=10分',
                className: 'scene-gamepad'
            },
            speaker: {
                title: '🔊 射擊智能音箱',
                scoreInfo: '大音箱🔊=5分 | 小音箱🔊=10分',
                className: 'scene-speaker'
            },
            book: {
                title: '📚 射擊編程書籍',
                scoreInfo: '大書📚=5分 | 小書📚=10分',
                className: 'scene-book'
            },
            lock: {
                title: '🔒 射擊鎖牌',
                scoreInfo: '大鎖🔒=5分 | 小鎖🔒=10分',
                className: 'scene-lock'
            }
        };

        // 選擇場景
        function selectScene(scene) {
            currentScene = scene;
            const config = sceneConfigs[scene];
            
            // 更新UI
            gameTitleElement.textContent = config.title;
            scoreInfoElement.textContent = config.scoreInfo;
            
            // 更新背景
            gameContainerElement.className = `game-container rounded-lg shadow-xl overflow-hidden flex-1 ${config.className}`;
            
            // 切換界面
            sceneSelectorElement.classList.add('hidden');
            gameInterfaceElement.classList.remove('hidden');
            
            // 重置遊戲
            resizeCanvas();
            loadLeaderboard();
        }

        // 返回場景選擇
        function backToSceneSelect() {
            sceneSelectorElement.classList.remove('hidden');
            gameInterfaceElement.classList.add('hidden');
            
            // 停止遊戲
            if (gameState.isPlaying) {
                endGame();
            }
        }

        // 設置canvas大小 - 大尺寸版本
        function resizeCanvas() {
            const container = canvas.parentElement;
            const aspectRatio = 1920 / 1080;
            
            // 使用更大的尺寸
            const availableWidth = window.innerWidth - 320; // 減去側邊欄寬度
            const availableHeight = window.innerHeight - 200; // 減去標題和控制欄高度
            
            let newWidth, newHeight;
            
            if (availableWidth / availableHeight > aspectRatio) {
                // 以高度為準
                newHeight = availableHeight;
                newWidth = newHeight * aspectRatio;
            } else {
                // 以寬度為準
                newWidth = availableWidth;
                newHeight = newWidth / aspectRatio;
            }
            
            // 確保最小尺寸
            newWidth = Math.max(newWidth, 800);
            newHeight = Math.max(newHeight, 450);
            
            canvas.width = newWidth;
            canvas.height = newHeight;
            
            // 更新容器樣式
            container.style.width = newWidth + 'px';
            container.style.height = newHeight + 'px';
        }
        
        window.addEventListener('resize', resizeCanvas);

        // 排行榜系統（每個場景獨立）
        let leaderboards = {
            gamepad: [],
            speaker: [],
            book: [],
            lock: []
        };
        
        function loadLeaderboard() {
            updateLeaderboardDisplay();
        }
        
        function updateLeaderboardDisplay() {
            const currentLeaderboard = leaderboards[currentScene];
            if (currentLeaderboard.length === 0) {
                leaderboardElement.innerHTML = '<div class="text-center text-gray-500 dark:text-gray-400">暫無記錄</div>';
                return;
            }
            
            const html = currentLeaderboard
                .sort((a, b) => b.score - a.score)
                .slice(0, 10)
                .map((entry, index) => {
                    const medalEmoji = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : `${index + 1}.`;
                    const textColor = index < 3 ? 'text-yellow-600 dark:text-yellow-400' : 'text-gray-700 dark:text-gray-300';
                    return `
                        <div class="flex justify-between items-center p-2 bg-gray-50 dark:bg-gray-700 rounded">
                            <span class="${textColor} font-semibold">${medalEmoji} ${entry.name}</span>
                            <span class="${textColor} font-bold">${entry.score}分</span>
                        </div>
                    `;
                })
                .join('');
            
            leaderboardElement.innerHTML = html;
        }
        
        function addToLeaderboard(name, score) {
            const entry = {
                name: name.trim() || '匿名玩家',
                score: score,
                date: new Date().toLocaleString()
            };
            
            leaderboards[currentScene].push(entry);
            updateLeaderboardDisplay();
        }

        // 遊戲狀態
        let gameState = {
            isPlaying: false,
            gameScore: 0,
            timeLeft: 30,
            targets: [],
            lastTargetTime: 0,
            gameTimer: null,
            spawnTimer: null,
            maxGameScore: 999
        };

        // 目標物體基類
        class Target {
            constructor() {
                this.reset();
                this.isLarge = Math.random() > 0.3;
                this.width = this.isLarge ? 80 : 55; // 增大目標物體
                this.height = this.isLarge ? 80 : 55;
                this.hit = false;
                this.score = this.isLarge ? 5 : 10;
            }

            reset() {
                this.startX = Math.random() * (canvas.width - 120) + 60;
                this.x = this.startX;
                this.y = canvas.height + 80;
                
                this.vx = (Math.random() - 0.5) * 6 * 0.8;
                this.vy = -(Math.random() * 10 + 16) * 0.8;
                this.gravity = 0.35 * 0.8;
                this.rotation = 0;
                this.rotationSpeed = (Math.random() - 0.5) * 0.25 * 0.8;
            }

            update() {
                if (this.hit) return;
                
                this.x += this.vx;
                this.y += this.vy;
                this.vy += this.gravity;
                this.rotation += this.rotationSpeed;
            }

            isClicked(mouseX, mouseY) {
                if (this.hit) return false;
                return mouseX >= this.x && mouseX <= this.x + this.width &&
                       mouseY >= this.y && mouseY <= this.y + this.height;
            }

            isOffScreen() {
                return this.y > canvas.height + 150;
            }
        }

        // 遊戲手柄類
        class Gamepad extends Target {
            draw() {
                if (this.hit) return;
                
                ctx.save();
                ctx.translate(this.x + this.width/2, this.y + this.height/2);
                ctx.rotate(this.rotation);
                
                const w = this.width;
                const h = this.height;
                
                // 主體
                ctx.fillStyle = '#2C3E50';
                ctx.roundRect(-w/2, -h/2, w, h, 10);
                ctx.fill();
                
                // 左搖桿
                ctx.fillStyle = '#34495E';
                ctx.beginPath();
                ctx.arc(-w/4, -h/6, w/8, 0, Math.PI * 2);
                ctx.fill();
                
                // 右搖桿
                ctx.beginPath();
                ctx.arc(w/4, h/6, w/8, 0, Math.PI * 2);
                ctx.fill();
                
                // 方向鍵
                ctx.fillStyle = '#7F8C8D';
                ctx.fillRect(-w/3, 0, w/6, h/8);
                ctx.fillRect(-w/4, -h/12, h/8, w/6);
                
                // 按鈕
                const colors = ['#E74C3C', '#F39C12', '#27AE60', '#3498DB'];
                for (let i = 0; i < 4; i++) {
                    const angle = (i * Math.PI / 2);
                    const x = Math.cos(angle) * w/6;
                    const y = Math.sin(angle) * w/6;
                    ctx.fillStyle = colors[i];
                    ctx.beginPath();
                    ctx.arc(w/4 + x, -h/6 + y, w/12, 0, Math.PI * 2);
                    ctx.fill();
                }
                
                ctx.restore();
            }
        }

        // 智能音箱類
        class Speaker extends Target {
            draw() {
                if (this.hit) return;
                
                ctx.save();
                ctx.translate(this.x + this.width/2, this.y + this.height/2);
                ctx.rotate(this.rotation);
                
                const w = this.width;
                const h = this.height;
                
                // 主體（圓柱形）
                ctx.fillStyle = '#1C1C1C';
                ctx.roundRect(-w/2, -h/2, w, h, w/4);
                ctx.fill();
                
                // 揚聲器網格
                ctx.strokeStyle = '#555';
                ctx.lineWidth = 2;
                for (let i = -3; i <= 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(-w/3, i * h/8);
                    ctx.lineTo(w/3, i * h/8);
                    ctx.stroke();
                }
                
                // LED指示燈
                ctx.fillStyle = '#00FF00';
                ctx.beginPath();
                ctx.arc(0, -h/3, w/16, 0, Math.PI * 2);
                ctx.fill();
                
                // 品牌標誌區域
                ctx.fillStyle = '#333';
                ctx.fillRect(-w/3, h/4, w*2/3, h/6);
                
                ctx.restore();
            }
        }

        // 編程書籍類
        class Book extends Target {
            constructor() {
                super();
                this.width = this.isLarge ? 70 : 50;
                this.height = this.isLarge ? 95 : 70;
                this.color = this.getRandomColor();
            }

            draw() {
                if (this.hit) return;
                
                ctx.save();
                ctx.translate(this.x + this.width/2, this.y + this.height/2);
                ctx.rotate(this.rotation);
                
                const w = this.width;
                const h = this.height;
                
                // 書籍封面
                ctx.fillStyle = this.color;
                ctx.fillRect(-w/2, -h/2, w, h);
                
                // 書脊
                ctx.fillStyle = this.darkenColor(this.color);
                ctx.fillRect(-w/2, -h/2, w/6, h);
                
                // 標題區域
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(-w/2 + w/4, -h/3, w/2, h/8);
                
                // 作者區域
                ctx.fillRect(-w/2 + w/4, h/6, w/2, h/12);
                
                // 程式碼圖案
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 2;
                ctx.font = `${w/6}px monospace`;
                ctx.fillStyle = '#FFFFFF';
                ctx.textAlign = 'center';
                ctx.fillText('{ }', 0, 0);
                ctx.fillText('< />', 0, h/8);
                
                ctx.restore();
            }

            getRandomColor() {
                const colors = ['#3498DB', '#E74C3C', '#2ECC71', '#F39C12', '#9B59B6', '#1ABC9C'];
                return colors[Math.floor(Math.random() * colors.length)];
            }

            darkenColor(color) {
                const colorMap = {
                    '#3498DB': '#2980B9',
                    '#E74C3C': '#C0392B',
                    '#2ECC71': '#27AE60',
                    '#F39C12': '#E67E22',
                    '#9B59B6': '#8E44AD',
                    '#1ABC9C': '#16A085'
                };
                return colorMap[color] || '#2C3E50';
            }
        }

        // 鎖牌類
        class Lock extends Target {
            draw() {
                if (this.hit) return;
                
                ctx.save();
                ctx.translate(this.x + this.width/2, this.y + this.height/2);
                ctx.rotate(this.rotation);
                
                const w = this.width;
                const h = this.height;
                
                // 鎖身
                ctx.fillStyle = '#D4AF37';
                ctx.roundRect(-w/2, -h/6, w, h*2/3, w/8);
                ctx.fill();
                
                // 鎖環
                ctx.strokeStyle = '#D4AF37';
                ctx.lineWidth = w/10;
                ctx.beginPath();
                ctx.arc(0, -h/4, w/4, Math.PI, 0);
                ctx.stroke();
                
                // 鎖孔
                ctx.fillStyle = '#2C3E50';
                ctx.beginPath();
                ctx.arc(0, h/12, w/6, 0, Math.PI * 2);
                ctx.fill();
                
                // 鎖孔開口
                ctx.fillRect(-w/20, h/12, w/10, h/6);
                
                // 金屬光澤
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fillRect(-w/2 + w/8, -h/6 + h/12, w/8, h/2);
                
                ctx.restore();
            }
        }

        // 創建目標工廠
        function createTarget() {
            switch (currentScene) {
                case 'gamepad': return new Gamepad();
                case 'speaker': return new Speaker();
                case 'book': return new Book();
                case 'lock': return new Lock();
                default: return new Gamepad();
            }
        }

        // 生成新目標
        function spawnTarget() {
            if (!gameState.isPlaying) return;
            
            gameState.targets.push(createTarget());
            
            const nextSpawnTime = Math.random() * 750 + 400;
            gameState.spawnTimer = setTimeout(spawnTarget, nextSpawnTime);
        }

        // 遊戲循環
        function gameLoop() {
            if (!gameState.isPlaying) return;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            //drawClouds();

            gameState.targets.forEach((target, index) => {
                target.update();
                target.draw();

                if (target.isOffScreen()) {
                    gameState.targets.splice(index, 1);
                }
            });

            drawCrosshair();
            requestAnimationFrame(gameLoop);
        }

        // 繪製雲朵背景（按比例調整）
        function drawClouds() {
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            const scale = canvas.width / 800; // 根據canvas大小調整雲朵
            for (let i = 0; i < 3; i++) {
                const x = (Date.now() * 0.01 + i * 200 * scale) % (canvas.width + 100 * scale) - 50 * scale;
                const y = 50 * scale + i * 40 * scale;
                ctx.beginPath();
                ctx.arc(x, y, 20 * scale, 0, Math.PI * 2);
                ctx.arc(x + 30 * scale, y, 35 * scale, 0, Math.PI * 2);
                ctx.arc(x + 60 * scale, y, 25 * scale, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // 繪製準心（按比例調整）
        function drawCrosshair() {
            if (!gameState.mouseX || !gameState.mouseY) return;
            
            const scale = canvas.width / 800;
            const crossSize = 12 * scale;
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(gameState.mouseX - crossSize, gameState.mouseY);
            ctx.lineTo(gameState.mouseX + crossSize, gameState.mouseY);
            ctx.moveTo(gameState.mouseX, gameState.mouseY - crossSize);
            ctx.lineTo(gameState.mouseX, gameState.mouseY + crossSize);
            ctx.stroke();
        }

        // 點擊事件
        canvas.addEventListener('click', (e) => {
            if (!gameState.isPlaying) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            const mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);

            gameState.targets.forEach((target, index) => {
                if (target.isClicked(mouseX, mouseY)) {
                    target.hit = true;
                    const scoreToAdd = target.score;
                    gameState.gameScore = Math.min(gameState.gameScore + scoreToAdd, gameState.maxGameScore);
                    gameScoreElement.textContent = gameState.gameScore;
                    
                    gameState.targets.splice(index, 1);
                    createHitEffect(mouseX, mouseY, target.isLarge, scoreToAdd);
                }
            });
        });

        // 觸控事件支援
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const clickEvent = new MouseEvent('click', {
                clientX: touch.clientX,
                clientY: touch.clientY
            });
            canvas.dispatchEvent(clickEvent);
        });

        // 滑鼠移動事件
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            gameState.mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
            gameState.mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
        });

        // 創建簡化的擊中特效（移除文字特效）
        function createHitEffect(x, y, isLarge, score) {
            const particleCount = isLarge ? 15 : 10;
            const particleSize = isLarge ? 6 : 4;
            
            for (let i = 0; i < particleCount; i++) {
                const angle = (Math.PI * 2 / particleCount) * i + Math.random() * 0.5;
                const velocity = Math.random() * 4 + 3;
                const life = 25;
                
                createParticle(x, y, angle, velocity, particleSize, life);
            }
            
            createScoreEffect(x, y, score, isLarge);
            createFlashEffect(x, y, isLarge);
        }
        
        // 粒子動畫
        function createParticle(startX, startY, angle, velocity, size, life) {
            let currentLife = life;
            let x = startX;
            let y = startY;
            const vx = Math.cos(angle) * velocity;
            const vy = Math.sin(angle) * velocity;
            const colors = ['#FFD700', '#FF6B6B', '#4ECDC4', '#45B7D1', '#96CEB4', '#FFEAA7'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            function animateParticle() {
                if (currentLife <= 0) return;
                
                x += vx;
                y += vy;
                currentLife--;
                
                const alpha = currentLife / life;
                const currentSize = size * alpha;
                
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x, y, currentSize, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                
                requestAnimationFrame(animateParticle);
            }
            
            animateParticle();
        }
        
        // 分數顯示特效
        function createScoreEffect(x, y, score, isLarge) {
            let offsetY = 0;
            let alpha = 1;
            let scale = isLarge ? 1.5 : 1.2;
            const duration = 70;
            let frame = 0;
            
            function animateScore() {
                if (frame >= duration) return;
                
                offsetY -= 2;
                alpha = 1 - (frame / duration);
                scale += 0.03;
                
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = score === 10 ? '#00FF00' : '#FFD700';
                ctx.font = `bold ${20 * scale}px Arial`;
                ctx.textAlign = 'center';
                ctx.fillText(`+${score}`, x, y + offsetY);
                ctx.restore();
                
                frame++;
                requestAnimationFrame(animateScore);
            }
            
            animateScore();
        }
        
        // 閃光效果
        function createFlashEffect(x, y, isLarge) {
            let radius = 0;
            let alpha = 0.8;
            const maxRadius = isLarge ? 40 : 25;
            const duration = 20;
            let frame = 0;
            
            function animateFlash() {
                if (frame >= duration) return;
                
                radius = (frame / duration) * maxRadius;
                alpha = 0.8 * (1 - frame / duration);
                
                ctx.save();
                ctx.globalAlpha = alpha;
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
                gradient.addColorStop(0, '#FFFFFF');
                gradient.addColorStop(0.5, '#FFD700');
                gradient.addColorStop(1, 'transparent');
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                
                frame++;
                requestAnimationFrame(animateFlash);
            }
            
            animateFlash();
        }

        // 開始遊戲
        function startGame() {
            gameState.isPlaying = true;
            gameState.gameScore = 0;
            gameState.timeLeft = 30;
            gameState.targets = [];
            
            gameScoreElement.textContent = '0';
            timeElement.textContent = '30';
            startBtn.textContent = '遊戲中...';
            startBtn.disabled = true;

            gameState.gameTimer = setInterval(() => {
                gameState.timeLeft--;
                timeElement.textContent = gameState.timeLeft;
                
                if (gameState.timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            spawnTarget();
            gameLoop();
        }

        // 結束遊戲
        function endGame() {
            gameState.isPlaying = false;
            
            if (gameState.gameTimer) {
                clearInterval(gameState.gameTimer);
                gameState.gameTimer = null;
            }
            if (gameState.spawnTimer) {
                clearTimeout(gameState.spawnTimer);
                gameState.spawnTimer = null;
            }

            finalScoreElement.textContent = gameState.gameScore;
            nameInputModal.classList.remove('hidden');
            playerNameInput.focus();
            
            startBtn.textContent = '開始遊戲';
            startBtn.disabled = false;
        }

        // 保存成績並關閉彈窗
        function saveScore() {
            const playerName = playerNameInput.value.trim();
            addToLeaderboard(playerName, gameState.gameScore);
            nameInputModal.classList.add('hidden');
            playerNameInput.value = '';
        }
        
        // 再玩一次
        function playAgain() {
            nameInputModal.classList.add('hidden');
            playerNameInput.value = '';
            startGame();
        }

        // 事件監聽
        startBtn.addEventListener('click', startGame);
        saveScoreBtn.addEventListener('click', saveScore);
        playAgainBtn.addEventListener('click', playAgain);
        backToSelectBtn.addEventListener('click', backToSceneSelect);
        
        playerNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                saveScore();
            }
        });

        // Canvas添加roundRect支援（如果瀏覽器不支援）
        if (!CanvasRenderingContext2D.prototype.roundRect) {
            CanvasRenderingContext2D.prototype.roundRect = function(x, y, width, height, radius) {
                this.beginPath();
                this.moveTo(x + radius, y);
                this.lineTo(x + width - radius, y);
                this.quadraticCurveTo(x + width, y, x + width, y + radius);
                this.lineTo(x + width, y + height - radius);
                this.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
                this.lineTo(x + radius, y + height);
                this.quadraticCurveTo(x, y + height, x, y + height - radius);
                this.lineTo(x, y + radius);
                this.quadraticCurveTo(x, y, x + radius, y);
                this.closePath();
            };
        }
    </script>
